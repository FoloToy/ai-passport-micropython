name: Build and release AI Passport firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-passport-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32-C3 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up ESP-IDF 5.5.3
        uses: ./.github/actions/setup_esp32
        with:
          idf_ver: v5.5.3
          ccache_key: ai-passport-release

      - name: Build MicroPython board
        shell: bash
        run: |
          source esp-idf/export.sh
          make -C ports/esp32 BOARD=FOLOTOY_AI_PASSPORT -j2

      - name: Create merged image and checksums
        shell: bash
        run: |
          source esp-idf/export.sh
          build="ports/esp32/build-FOLOTOY_AI_PASSPORT"
          python -m esptool --chip esp32c3 merge_bin \
            -o ports/esp32/build-FOLOTOY_AI_PASSPORT-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 "$build/bootloader/bootloader.bin" \
            0x8000 "$build/partition_table/partition-table.bin" \
            0x10000 "$build/micropython.bin"
          sha256sum ports/esp32/build-FOLOTOY_AI_PASSPORT-merged.bin \
            > ports/esp32/build-FOLOTOY_AI_PASSPORT-merged.bin.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-micropython-firmware
          path: |
            ports/esp32/build-FOLOTOY_AI_PASSPORT-merged.bin
            ports/esp32/build-FOLOTOY_AI_PASSPORT-merged.bin.sha256

      - name: Create GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ports/esp32/build-FOLOTOY_AI_PASSPORT-merged.bin \
            ports/esp32/build-FOLOTOY_AI_PASSPORT-merged.bin.sha256 \
            --title "AI Passport MicroPython ${GITHUB_REF_NAME}" \
            --generate-notes
